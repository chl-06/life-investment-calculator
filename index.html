<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2ecc71">
<link rel="manifest" href="/life-investment-calculator/manifest.json">
<link rel="icon" href="/life-investment-calculator/icons/icon.svg" type="image/svg+xml">
<title>人生 ROI 计算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 30px 16px;
  }

  .container {
    background: white;
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  h1 {
    color: #2c3e50;
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #95a5a6;
    font-size: 13px;
    text-align: center;
    margin-bottom: 20px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .input-row input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .input-row input:focus { border-color: #2ecc71; }

  .time-picker {
    display: flex;
    align-items: center;
    gap: 2px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 2px;
    flex-shrink: 0;
  }
  .time-picker button {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 18px;
    color: #555;
    cursor: pointer;
  }
  .time-picker button:active { background: #ecf0f1; }
  .time-picker span {
    min-width: 32px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #2c3e50;
  }

  button {
    padding: 12px;
    background-color: #2ecc71;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    font-family: inherit;
    transition: background 0.2s;
  }
  button:active { background-color: #27ae60; }

  .btn-full { width: 100%; }
  .btn-sm {
    padding: 8px 14px;
    background: #ecf0f1;
    color: #555;
    font-size: 12px;
  }
  .btn-sm:active { background: #ddd; }
  .btn-danger {
    background: transparent;
    color: #e74c3c;
    padding: 2px 6px;
    font-size: 12px;
    width: auto;
  }
  .btn-calc {
    background-color: #2ecc71;
    font-size: 16px;
    padding: 14px;
    margin: 8px 0;
  }
  .btn-calc:disabled { background: #bdc3c7; cursor: not-allowed; }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 36px;
    margin: 12px 0;
  }
  .tag-list:empty::after {
    content: '还没有添加行为，在上方输入吧 ✍️';
    color: #bdc3c7;
    font-size: 13px;
    padding: 8px 0;
    width: 100%;
    text-align: center;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .preset-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    padding-top: 12px;
    border-top: 1px solid #ecf0f1;
  }
  .preset-btn {
    padding: 4px 10px;
    border: 1px solid #ddd;
    border-radius: 20px;
    background: white;
    color: #666;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .preset-btn:active { background: #ecf0f1; }

  .divider { height: 1px; background: #ecf0f1; margin: 12px 0; }

  .result-section { display: none; }

  .score-box {
    text-align: center;
    padding: 16px;
    background: #f9f9f9;
    border-radius: 12px;
    margin-bottom: 14px;
  }
  .score-box .score-num {
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
  }
  .score-box .score-label {
    font-size: 13px;
    color: #7f8c8d;
    margin-top: 4px;
  }

  .result-card {
    padding: 14px;
    background-color: #f9f9f9;
    border-left: 5px solid #2ecc71;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .result-card.red { border-left-color: #e74c3c; }
  .result-card.orange { border-left-color: #f39c12; }

  .result-card .rc-title {
    font-size: 11px;
    color: #95a5a6;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .result-card .rc-value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 2px;
  }
  .result-card .rc-sub {
    font-size: 12px;
    color: #7f8c8d;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .metric {
    background: #f9f9f9;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .metric .m-label {
    font-size: 10px;
    color: #95a5a6;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .metric .m-value {
    font-size: 18px;
    font-weight: 700;
    margin-top: 2px;
  }
  .metric .m-sub {
    font-size: 11px;
    color: #7f8c8d;
  }

  .alloc-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid #ecf0f1;
  }
  .alloc-item:last-child { border-bottom: none; }
  .alloc-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .alloc-item .al-name { flex: 1; font-weight: 500; }
  .alloc-item .al-bar {
    flex: 2;
    height: 6px;
    background: #ecf0f1;
    border-radius: 3px;
    overflow: hidden;
  }
  .alloc-item .al-bar-fill {
    height: 100%;
    border-radius: 3px;
  }
  .alloc-item .al-pct {
    min-width: 36px;
    text-align: right;
    font-weight: 600;
    color: #555;
  }

  .tips {
    background: #fef9e7;
    border-left: 4px solid #f39c12;
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.7;
    color: #7d6608;
    margin-top: 10px;
  }
  .tips strong { color: #5a4a02; }

  .verdict-box {
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 10px;
  }
  .verdict-box .v-icon { font-size: 36px; }
  .verdict-box .v-title { font-size: 18px; font-weight: 700; margin: 6px 0 2px; }
  .verdict-box .v-desc { font-size: 13px; opacity: 0.75; }
  .verdict-good { background: #eafaf1; color: #1e8449; }
  .verdict-meh { background: #fef9e7; color: #7d6608; }
  .verdict-bad { background: #fdedec; color: #922b21; }

  .risk-item {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    font-size: 12px;
    color: #555;
    border-bottom: 1px solid #ecf0f1;
  }
  .risk-item:last-child { border-bottom: none; }

  .footer {
    text-align: center;
    font-size: 11px;
    color: #bdc3c7;
    margin-top: 16px;
  }

  /* Mobile */
  @media (max-width: 460px) {
    body { padding: 16px 10px; }
    .container { padding: 16px; border-radius: 16px; }
    h1 { font-size: 20px; }
    .metric-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">

  <h1>人生 ROI 计算器</h1>
  <div class="subtitle">输入每天做的事，自动分类并计算回报率</div>

  <!-- Input -->
  <div class="input-row">
    <input type="text" id="habitName" placeholder="如：刷短视频、健身、上班..." maxlength="20">
    <div class="time-picker">
      <button onclick="adjTime(-0.5)">−</button>
      <span id="timeDisplay">1</span>
      <button onclick="adjTime(0.5)">+</button>
    </div>
  </div>

  <div style="display:flex;gap:8px;">
    <button class="btn-full" onclick="addHabit()">+ 添加</button>
    <button class="btn-sm" onclick="clearHabits()" style="flex-shrink:0;">清空</button>
  </div>

  <div class="tag-list" id="tagList"></div>

  <div class="preset-row">
    <span style="font-size:10px;color:#bdc3c7;padding:4px 0;">快捷填充：</span>
    <button class="preset-btn" onclick="loadPreset('打工人')">打工人</button>
    <button class="preset-btn" onclick="loadPreset('卷王')">卷王</button>
    <button class="preset-btn" onclick="loadPreset('躺平')">躺平</button>
    <button class="preset-btn" onclick="loadPreset('自律达人')">自律达人</button>
    <button class="preset-btn" onclick="loadPreset('人生赢家')">人生赢家</button>
  </div>

  <button class="btn-full btn-calc" id="calcBtn" onclick="calculate()" disabled>开始分析人生 ROI</button>

  <!-- Results -->
  <div id="results" class="result-section">

    <div class="score-box" id="scoreBox">
      <div class="score-num" id="scoreNum">--</div>
      <div class="score-label" id="scoreGrade">点击上方按钮查看</div>
    </div>

    <div class="metric-grid" id="metricGrid"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div style="background:#f9f9f9;border-radius:8px;padding:12px;">
        <div style="font-size:11px;color:#95a5a6;font-weight:600;text-transform:uppercase;margin-bottom:8px;">⏳ 时间分配</div>
        <div id="allocContent"><div style="color:#bdc3c7;font-size:12px;text-align:center;padding:10px;">暂无数据</div></div>
      </div>
      <div style="background:#f9f9f9;border-radius:8px;padding:12px;">
        <div style="font-size:11px;color:#95a5a6;font-weight:600;text-transform:uppercase;margin-bottom:8px;">⚠️ 风险</div>
        <div id="riskContent"><div style="color:#bdc3c7;font-size:12px;text-align:center;padding:10px;">暂无数据</div></div>
      </div>
    </div>

    <div id="verdictContent"></div>
    <div id="tipsContent"></div>
  </div>

  <div class="footer">人生有风险，活着需谨慎 · 仅供娱乐</div>
</div>

<script>
// ===== 自动分类 =====
function classify(name) {
  const n = name.trim().toLowerCase();
  if (/加班|内耗|拖延|摸鱼|发呆|摆烂|焦虑|emo/.test(n)) return 'liability';
  if (/刷短?视频|刷抖[音手]|刷b站|刷微[博信]|刷小红[书]|刷朋友[圈]|刷头[条]|刷资[讯]|刷直[播]|玩手[机]|看手[机]/.test(n)) return 'depreciation';
  if (/健身|跑步|锻炼|运动|撸铁|瑜伽|游泳|跳绳|打球|学习|读书|阅读|看书|上课|听课|复习|备考|背单词|练习|写作|写代码|编程|创作|冥想|正念|复盘|计划|规划|思考|反思|日记|深度工作/.test(n)) return 'investment';
  if (/陪家人|陪父[母]|陪孩[子]|陪对[象]|陪女?朋友|陪老[婆公]|陪娃|带娃|约会|聚餐|聊天|社交|聚会|串门|拜访|电话|视频|谈恋爱|相亲|交友/.test(n)) return 'dividend';
  if (/追剧|看剧|看电[影]|看视[频]|看动[漫]|看综[艺]|打游[戏]|玩游[戏]|王者|吃鸡|原神|听歌|听音[乐]|看小[说]|逛街|购物|淘宝|京东|拼多多|旅游|旅行|出去[玩]|散步|遛弯/.test(n)) return 'expense';
  if (/通勤|坐车|开车|地铁|公交|赶路|家务|扫地|拖地|洗碗|洗衣[服]|整理|收纳|打扫|倒垃[圾]|买菜|排队|等待|拿快[递]|拿外[卖]|遛狗/.test(n)) return 'operating';
  if (/睡觉|睡眠|午睡|休息|打盹|吃饭|早[餐午晚餐]|做饭|烹饪|洗漱|洗澡|洗头|刷牙|护肤|化妆|换衣[服]|上厕[所]|看病|体检/.test(n)) return 'maintenance';
  if (/[班工]/.test(n)) return 'investment';
  return 'expense';
}

function getTag(type) {
  const m = {
    investment:    { label: '📈 增值', color: '#27ae60', bg: '#eafaf1' },
    dividend:      { label: '💛 社交', color: '#d68910', bg: '#fef9e7' },
    maintenance:   { label: '🔋 维护', color: '#2980b9', bg: '#eaf2f8' },
    expense:       { label: '🎮 娱乐', color: '#8e44ad', bg: '#f4ecf7' },
    depreciation:  { label: '📉 消耗', color: '#c0392b', bg: '#fdedec' },
    liability:     { label: '⛓️ 损耗', color: '#922b21', bg: '#fdedec' },
    operating:     { label: '📋 杂务', color: '#7f8c8d', bg: '#f2f3f4' },
  };
  return m[type] || m.expense;
}

const CAT = {
  investment:    { coeff: 1.8, color: '#27ae60' },
  dividend:      { coeff: 1.3, color: '#d68910' },
  maintenance:   { coeff: 0.9, color: '#2980b9' },
  expense:       { coeff: 0.5, color: '#8e44ad' },
  depreciation:  { coeff: 0.15, color: '#c0392b' },
  liability:     { coeff: -0.3, color: '#922b21' },
  operating:     { coeff: 0.4, color: '#7f8c8d' },
};
const KEYS = Object.keys(CAT);
let habits = [];
let curTime = 1;

function adjTime(d) { curTime = Math.max(0.5, Math.min(16, curTime + d)); document.getElementById('timeDisplay').textContent = curTime; }

function addHabit() {
  const el = document.getElementById('habitName');
  const name = el.value.trim();
  if (!name) return;
  habits.push({ name, hours: curTime, type: classify(name) });
  el.value = ''; el.focus();
  render(); enable();
}

function removeHabit(i) { habits.splice(i, 1); render(); enable(); }
function clearHabits() { if (habits.length) { habits = []; render(); enable(); } }

function render() {
  document.getElementById('tagList').innerHTML = habits.map((h, i) => {
    const t = getTag(h.type);
    return `<span class="tag" style="background:${t.bg};color:${t.color}">${t.label} ${h.name} ${h.hours}h <button class="btn-danger" onclick="removeHabit(${i})">✕</button></span>`;
  }).join('');
}

function enable() { document.getElementById('calcBtn').disabled = habits.length === 0; }

const PRESETS = {
  '打工人': [['睡觉',7],['吃饭洗漱',1.5],['上班',9],['通勤',1.5],['刷手机',2],['追剧',1],['发呆拖延',1],['社交',0.5],['家务',0.5]],
  '卷王': [['睡觉',5.5],['吃饭',1],['加班工作',13],['通勤',1],['健身',0.5],['学习',1],['刷资讯',1],['社交',0.5],['洗漱',0.5]],
  '躺平': [['睡觉',9],['吃饭',2],['刷短视频',4],['打游戏',3],['追剧',2],['躺床发呆',2],['吃零食',1],['拿外卖',0.5],['洗澡',0.5]],
  '自律达人': [['睡觉',7.5],['健身',1.5],['学习阅读',2.5],['工作',7],['冥想',0.5],['做饭',1],['陪家人',1.5],['社交',1],['爱好',1],['洗漱',0.5]],
  '人生赢家': [['睡觉',7],['锻炼',1],['深度工作',6],['学习',1.5],['陪家人',2],['社交',1.5],['创作创业',2],['阅读',1],['休闲',1],['吃饭洗漱',1]]
};

function loadPreset(name) {
  habits = (PRESETS[name]||[]).map(d => ({ name:d[0], hours:d[1], type:classify(d[0]) }));
  render(); enable(); calculate();
}

function calculate() {
  if (!habits.length) return;
  document.getElementById('results').style.display = 'block';
  setTimeout(() => document.getElementById('results').scrollIntoView({ behavior:'smooth' }), 50);

  const total = habits.reduce((s,h) => s + h.hours, 0);
  const g = {}; KEYS.forEach(k => { g[k] = { hours:0, items:[] }; });
  habits.forEach(h => { if (!g[h.type]) g[h.type] = { hours:0, items:[] }; g[h.type].hours += h.hours; g[h.type].items.push(h); });

  let w = 0, tw = 0;
  KEYS.forEach(k => { if (g[k].hours > 0) { w += g[k].hours * CAT[k].coeff; tw += g[k].hours; } });
  const avg = tw > 0 ? w / tw : 0;

  let score = (avg + 0.5) / 2.3 * 100;
  const dH = g.depreciation?.hours||0, lH = g.liability?.hours||0, iH = g.investment?.hours||0;
  const sH = g.maintenance?.items?.filter(i => /睡/.test(i.name)).reduce((s,i) => s+i.hours, 0) || 0;
  score -= dH * 5 + lH * 5 - iH * 2;
  if (sH > 0 && sH < 6) score -= (6 - sH) * 5;
  score = Math.max(0, Math.min(100, score));

  let grade, gCls, color;
  if (score >= 80) { grade='优秀'; gCls='verdict-good'; color='#1e8449'; }
  else if (score >= 60) { grade='良好'; gCls='verdict-good'; color='#1e8449'; }
  else if (score >= 40) { grade='一般'; gCls='verdict-meh'; color='#7d6608'; }
  else { grade='堪忧'; gCls='verdict-bad'; color='#922b21'; }

  document.getElementById('scoreNum').textContent = Math.round(score);
  document.getElementById('scoreNum').style.color = color;
  document.getElementById('scoreGrade').textContent = '评级：' + grade;
  document.getElementById('scoreGrade').style.color = color;

  const eff = total > 0 ? (iH/total*100) : 0;
  const bad = total > 0 ? ((dH+lH)/total*100) : 0;
  const yr = Math.pow(1 + avg, 365) - 1;
  document.getElementById('metricGrid').innerHTML = `
    <div class="metric"><div class="m-label">增值效率</div><div class="m-value" style="color:${eff>30?'#27ae60':'#d68910'}">${eff.toFixed(0)}%</div><div class="m-sub">增值占比</div></div>
    <div class="metric"><div class="m-label">不良率</div><div class="m-value" style="color:${bad<20?'#27ae60':'#c0392b'}">${bad.toFixed(0)}%</div><div class="m-sub">消耗+损耗</div></div>
    <div class="metric"><div class="m-label">年化复利</div><div class="m-value" style="color:${yr>0?'#27ae60':'#c0392b'}">${yr>0?'+':''}${(yr*100).toFixed(0)}%</div><div class="m-sub">日回报滚动</div></div>`;

  // Allocation
  const sorted = KEYS.filter(k => g[k].hours > 0).sort((a,b) => g[b].hours - g[a].hours);
  document.getElementById('allocContent').innerHTML = sorted.length ? sorted.map(k => {
    const pct = g[k].hours / total * 100;
    return `<div class="alloc-item"><span class="dot" style="background:${CAT[k].color}"></span><span class="al-name">${CAT[k].label||k}</span><span class="al-bar"><span class="al-bar-fill" style="width:${pct}%;background:${CAT[k].color}"></span></span><span class="al-pct">${pct.toFixed(0)}%</span></div>`;
  }).join('') : '<div style="color:#bdc3c7;font-size:12px;text-align:center;padding:10px;">暂无数据</div>';

  // Risks
  const risks = [];
  if ((g.depreciation?.hours||0)/total > 0.15) risks.push(['📉', '消耗类占比过高，认知资本快速折旧']);
  if ((g.liability?.hours||0)/total > 0.10) risks.push(['⛓️', '损耗类超阈值，产生负收益']);
  if ((g.investment?.hours||0)/total < 0.15) risks.push(['📈', '增值类不足，长期跑输大盘']);
  if (sH > 0 && sH < 6) risks.push(['🔴', '睡眠仅' + sH.toFixed(1) + '小时']);
  if (risks.length === 0) risks.push(['🟢', '风险可控']);
  document.getElementById('riskContent').innerHTML = risks.map(r => '<div class="risk-item"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>').join('');

  // Verdict
  let icon, title, desc;
  if (score >= 80) { icon='🏆'; title='强烈买入'; desc='你的人生是一支优质资产。'; }
  else if (score >= 60) { icon='👍'; title='持有'; desc='底子不错，减少消耗更上一层楼。'; }
  else if (score >= 40) { icon='🤔'; title='观望'; desc='平庸但有救，重新审视时间配置。'; }
  else { icon='🚨'; title='紧急处理'; desc='建议启动人生资产重组。'; }
  document.getElementById('verdictContent').innerHTML = '<div class="verdict-box ' + gCls + '"><div class="v-icon">' + icon + '</div><div class="v-title">' + title + '</div><div class="v-desc">' + desc + '</div></div>';

  // Tips
  const tips = [];
  if (iH < 2) tips.push('📈 增加增值活动：每天至少 2 小时学习或锻炼');
  if (dH > 1) tips.push('📉 减少消耗：刷社交媒体控制在 30 分钟内');
  if (lH > 0.5) tips.push('⛓️ 止损损耗：无效加班和内耗是负资产');
  if (sH > 0 && sH < 7) tips.push('😴 保证睡眠：7-8 小时不可压缩');
  if ((g.dividend?.hours||0) < 0.5) tips.push('💛 增加社交：陪家人朋友是低风险高回报资产');
  document.getElementById('tipsContent').innerHTML = tips.length ? '<div class="tips"><strong>💡 优化建议</strong><br>' + tips.join('<br>') + '</div>' : '';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('habitName').addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/life-investment-calculator/sw.js');
}
</script>
