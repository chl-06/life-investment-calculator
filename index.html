<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人生 ROI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="人生 ROI">
<meta name="msapplication-TileColor" content="#f97316">
<link rel="manifest" href="/life-investment-calculator/manifest.json">
<link rel="icon" href="/life-investment-calculator/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/life-investment-calculator/icons/icon.svg">
<title>人生 ROI 计算器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fef9f0 0%, #fdf2e9 50%, #fef7ee 100%);
    color: #2d1f14;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .app { max-width: 900px; width: 100%; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    font-size: 38px; font-weight: 900;
    background: linear-gradient(135deg, #fb923c, #e11d48);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header p { color: #a18072; font-size: 14px; margin-top: 6px; }

  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 24px;
    box-shadow: 0 1px 3px rgba(251,146,60,0.06), 0 8px 32px rgba(251,146,60,0.06);
    padding: 20px 24px;
    margin-bottom: 16px;
    border: 1px solid rgba(251,146,60,0.08);
    transition: box-shadow 0.3s;
  }
  .card-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: #c4a294; margin-bottom: 14px;
  }

  /* Input */
  .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .input-row input {
    flex: 1; min-width: 0;
    border: 2px solid #f0e4dc; border-radius: 14px;
    padding: 14px 16px; font-size: 16px; font-family: inherit;
    outline: none; transition: all 0.25s; background: #fefcf9;
    color: #2d1f14;
    -webkit-appearance: none;
  }
  .input-row input:focus { border-color: #fb923c; background: #fff; box-shadow: 0 0 0 4px rgba(251,146,60,0.1); }
  .input-row input::placeholder { color: #d4c0b4; }

  .time-picker {
    display: flex; align-items: center; gap: 2px;
    background: #fefcf9; border: 2px solid #f0e4dc; border-radius: 14px; padding: 2px;
    flex-shrink: 0;
    transition: border-color 0.2s;
  }
  .time-picker:focus-within { border-color: #fb923c; }
  .time-picker button {
    width: 44px; height: 44px; border: none; background: transparent;
    border-radius: 12px; font-size: 20px; font-weight: 600; color: #c4a294;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative; overflow: hidden;
  }
  .time-picker button:active { background: #f5e8e0; color: #fb923c; }
  .time-picker span {
    min-width: 44px; text-align: center; font-size: 17px; font-weight: 700; color: #2d1f14;
  }

  .input-actions { display: flex; gap: 10px; }
  .btn {
    border: none; border-radius: 14px; padding: 14px 24px;
    font-size: 15px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative; overflow: hidden;
  }
  .btn-primary {
    background: linear-gradient(135deg, #fb923c, #e11d48);
    color: #fff; flex: 1;
    box-shadow: 0 4px 16px rgba(251,146,60,0.25);
  }
  .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(251,146,60,0.2); }
  .btn-secondary { background: #f5e8e0; color: #a18072; }
  .btn-secondary:active { background: #ede0d6; transform: scale(0.97); }

  /* Ripple */
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transform: scale(0);
    animation: rippleAnim 0.5s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* Tags */
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; }
  .tag-list:empty::after {
    content: '还没有添加内容 👆 输入你的日常行为吧';
    display: block; width: 100%; text-align: center;
    color: #d4c0b4; font-size: 13px; padding: 10px 0;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px 8px 16px; border-radius: 100px;
    font-size: 14px; font-weight: 500;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .tag .remove {
    width: 20px; height: 20px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.1); color: inherit; font-size: 12px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tag .remove:active { background: rgba(0,0,0,0.25); }

  /* Presets */
  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    border: 1.5px solid #f0e4dc; border-radius: 100px;
    padding: 8px 16px; font-size: 13px; font-family: inherit;
    font-weight: 500; color: #a18072; background: #fefcf9;
    cursor: pointer; transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .preset-btn:active { border-color: #fb923c; color: #fb923c; background: #fff7f0; transform: scale(0.96); }

  /* Calc button */
  .calc-wrap { text-align: center; margin: 8px 0 20px; }
  .btn-calc {
    width: 100%; max-width: 360px;
    padding: 18px 32px; font-size: 17px; font-weight: 700; border-radius: 18px;
    border: none; background: linear-gradient(135deg, #fb923c, #e11d48);
    color: #fff; cursor: pointer; font-family: inherit; transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 24px rgba(251,146,60,0.3);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative; overflow: hidden;
  }
  .btn-calc:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 3px 12px rgba(251,146,60,0.2); }
  .btn-calc:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Results */
  .results { display: none; }

  .score-hero { display: flex; align-items: center; gap: 28px; padding: 8px 0; }
  .score-ring { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
  .score-ring svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #f0e4dc; stroke-width: 10; }
  .ring-fill {
    fill: none; stroke-width: 10; stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .score-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-label .num { font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .score-label .grade { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .score-text { flex: 1; font-size: 14px; line-height: 1.7; color: #a18072; }
  .score-text strong { color: #2d1f14; }
  @media (max-width: 640px) {
    .score-hero { flex-direction: column; text-align: center; gap: 12px; }
    .score-ring { width: 120px; height: 120px; }
    .score-ring svg { width: 120px; height: 120px; }
  }
  @media (min-width: 1024px) {
    .score-hero { gap: 40px; }
    .score-ring { width: 160px; height: 160px; }
    .score-ring svg { width: 160px; height: 160px; }
    .score-label .num { font-size: 44px; }
    .score-text { font-size: 15px; }
  }

  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 0; }
  @media (max-width: 640px) { .metric-grid { grid-template-columns: 1fr; gap: 8px; } }
  .metric {
    background: linear-gradient(135deg, #fefcf9, #fdf6f0);
    border-radius: 16px; padding: 16px; text-align: center;
    border: 1px solid rgba(251,146,60,0.08);
  }
  .metric .m-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #c4a294; }
  .metric .m-value { font-size: 24px; font-weight: 800; margin-top: 4px; line-height: 1.2; }
  .metric .m-sub { font-size: 12px; color: #a18072; margin-top: 2px; }

  .alloc-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid #f5ece6; font-size: 14px;
  }
  .alloc-item:last-child { border-bottom: none; }
  .alloc-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .alloc-item .al-name { flex: 1; font-weight: 600; color: #2d1f14; }
  .alloc-item .al-bar {
    flex: 2; height: 8px; background: #f5ece6; border-radius: 4px; overflow: hidden;
  }
  .alloc-item .al-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .alloc-item .al-pct {
    font-size: 14px; font-weight: 700; color: #a18072; min-width: 44px; text-align: right;
  }

  .verdict-box { border-radius: 18px; padding: 24px; text-align: center; }
  .verdict-box .v-icon { font-size: 44px; }
  .verdict-box .v-title { font-size: 22px; font-weight: 800; margin: 8px 0 4px; }
  .verdict-box .v-desc { font-size: 14px; opacity: 0.75; }
  .verdict-good { background: linear-gradient(135deg, #fef7ee, #fde8d0); color: #9a4d1a; }
  .verdict-meh { background: linear-gradient(135deg, #fef7ee, #fde8d0); color: #9a4d1a; }
  .verdict-bad { background: linear-gradient(135deg, #fef2f2, #fce4e4); color: #991b1b; }

  .risk-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f5ece6; font-size: 13px; color: #a18072; }
  .risk-item:last-child { border-bottom: none; }
  .risk-item .ri-icon { font-size: 16px; line-height: 1.4; }

  .tips {
    background: linear-gradient(135deg, #fef7ee, #fde8d0);
    border-radius: 16px; padding: 16px 20px; font-size: 13px; line-height: 1.8; color: #9a4d1a;
  }
  .tips strong { color: #7a3a10; }

  .footer { text-align: center; font-size: 11px; color: #d4c0b4; margin-top: 28px; padding-top: 16px; border-top: 1px solid #f0e4dc; }
  .skeleton { color: #d4c0b4; text-align: center; padding: 20px; font-size: 14px; }

  /* ===== Responsive ===== */

  /* Phone (< 640px) */
  @media (max-width: 640px) {
    body { padding: 10px 8px; }
    .header { margin-bottom: 16px; }
    .header h1 { font-size: 24px; }
    .header p { font-size: 12px; }
    .card { padding: 14px 16px; border-radius: 16px; margin-bottom: 10px; }
    .card-title { font-size: 11px; margin-bottom: 10px; letter-spacing: 0.5px; }

    .input-row { flex-direction: row; gap: 8px; }
    .input-row input { font-size: 15px; padding: 10px 12px; border-radius: 12px; }
    .time-picker { border-radius: 12px; }
    .time-picker button { width: 40px; height: 40px; font-size: 18px; border-radius: 10px; }
    .time-picker span { min-width: 34px; font-size: 15px; }

    .input-actions { gap: 8px; }
    .btn { padding: 12px 16px; font-size: 14px; border-radius: 12px; }
    .btn-calc { font-size: 15px; padding: 14px 20px; max-width: 100%; border-radius: 14px; }
    .calc-wrap { margin: 4px 0 12px; }

    .tag { font-size: 12px; padding: 5px 10px 5px 12px; }
    .tag .remove { width: 18px; height: 18px; font-size: 10px; }

    .preset-btn { padding: 6px 10px; font-size: 11px; }
    .preset-row { gap: 5px; }
    .preset-row > span { display: none; }

    .score-ring { width: 100px; height: 100px; }
    .score-label .num { font-size: 28px; }
    .score-label .grade { font-size: 10px; }

    .metric-grid { gap: 6px; }
    .metric { padding: 10px; border-radius: 12px; }
    .metric .m-value { font-size: 18px; }

    .alloc-item { font-size: 12px; padding: 7px 0; gap: 8px; }
    .alloc-item .al-bar { flex: 1; }
    .alloc-item .al-pct { font-size: 12px; min-width: 36px; }

    .risk-item { font-size: 12px; padding: 6px 0; gap: 8px; }

    .verdict-box { padding: 16px; border-radius: 14px; }
    .verdict-box .v-icon { font-size: 30px; }
    .verdict-box .v-title { font-size: 16px; }
    .verdict-box .v-desc { font-size: 13px; }

    .tips { font-size: 12px; padding: 12px 14px; border-radius: 12px; }

    .footer { margin-top: 20px; font-size: 10px; }
  }

  /* iPad / Tablet (641px - 1024px) */
  @media (min-width: 641px) and (max-width: 1024px) {
    body { padding: 20px 24px; }
    .app { max-width: 100%; }
    .header h1 { font-size: 32px; margin-bottom: 4px; }

    .card { padding: 22px 26px; border-radius: 22px; }
    .card-title { font-size: 12px; }

    .score-hero { gap: 24px; }
    .score-ring { width: 130px; height: 130px; }

    .metric-grid { gap: 10px; }
    .metric .m-value { font-size: 22px; }

    .preset-btn { padding: 8px 14px; font-size: 12px; }
    .btn-calc { max-width: 320px; }
  }

  /* iPad Pro / small desktop (1025px - 1280px) */
  @media (min-width: 1025px) and (max-width: 1280px) {
    .app { max-width: 860px; }
    .header h1 { font-size: 36px; }
    .card { padding: 24px 28px; }
  }

  /* Large desktop (> 1280px) */
  @media (min-width: 1281px) {
    .app { max-width: 960px; }
    .header h1 { font-size: 42px; }
    .header p { font-size: 15px; }
    body { padding: 40px 32px; }
    .card { padding: 28px 32px; border-radius: 28px; margin-bottom: 20px; }
    .card-title { font-size: 13px; margin-bottom: 18px; }

    .input-row input { font-size: 17px; padding: 16px 18px; }
    .btn { padding: 16px 28px; font-size: 16px; }
    .btn-calc { padding: 20px 40px; font-size: 18px; max-width: 400px; }

    .tag { font-size: 15px; padding: 10px 18px 10px 20px; }
    .preset-btn { padding: 10px 20px; font-size: 14px; }

    .score-ring { width: 170px; height: 170px; }
    .score-label .num { font-size: 48px; }
    .score-label .grade { font-size: 12px; }
    .score-text { font-size: 16px; }

    .metric .m-value { font-size: 26px; }
    .metric { padding: 20px; }

    .alloc-item { font-size: 15px; padding: 12px 0; }
    .alloc-item .al-pct { font-size: 15px; }

    .verdict-box { padding: 32px; }
    .verdict-box .v-title { font-size: 26px; }

    .tips { font-size: 14px; padding: 20px 24px; }
  }

  /* Two-column: collapse at tablet portrait */
  @media (max-width: 820px) {
    div[style*="grid-template-columns:1fr 1fr"] {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
  }

  /* Touch device: remove hover */
  @media (hover: none) {
    .btn-primary:hover { transform: none; box-shadow: 0 4px 16px rgba(251,146,60,0.25); }
    .btn-calc:hover:not(:disabled) { transform: none; box-shadow: 0 6px 24px rgba(251,146,60,0.3); }
    .time-picker button:hover { background: transparent; color: #c4a294; }
    .preset-btn:hover { border-color: #f0e4dc; color: #a18072; background: #fefcf9; transform: none; }
  }

  /* Entry animation — visible by default, animates if supported */
  @keyframes cardIn {
    from { transform: translateY(12px); }
    to { transform: translateY(0); }
  }
  .card { animation: cardIn 0.35s ease-out forwards; }
  .card:nth-child(2) { animation-delay: 0.05s; }
  .card:nth-child(3) { animation-delay: 0.1s; }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <h1>人生 ROI 计算器</h1>
    <p>输入每天做的事，系统自动分类并计算投资回报率</p>
  </div>

  <!-- Input -->
  <div class="card">
    <div class="card-title">📋 录入日常行为</div>

    <div class="input-row">
      <input type="text" id="habitName" placeholder="比如：刷短视频、健身、上班..." maxlength="20" autocomplete="off">
      <div class="time-picker">
        <button ontouchstart="" onclick="adjTime(-0.5);tapVibrate()">−</button>
        <span id="timeDisplay">1</span>
        <button ontouchstart="" onclick="adjTime(0.5);tapVibrate()">+</button>
      </div>
    </div>

    <div class="input-actions">
      <button class="btn btn-primary" ontouchstart="" onclick="addHabit();tapVibrate()">+ 添加</button>
      <button class="btn btn-secondary" ontouchstart="" onclick="clearHabits();tapVibrate()">清空</button>
    </div>

    <div style="margin-top:16px;">
      <div class="tag-list" id="tagList"></div>
    </div>

    <div class="preset-row" style="margin-top:16px;padding-top:16px;border-top:1px solid #f5ece6;">
      <span style="font-size:11px;color:#d4c0b4;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;padding:5px 0;">模板</span>
      <button class="preset-btn" ontouchstart="" onclick="loadPreset('打工人');tapVibrate()">打工人</button>
      <button class="preset-btn" ontouchstart="" onclick="loadPreset('卷王');tapVibrate()">卷王</button>
      <button class="preset-btn" ontouchstart="" onclick="loadPreset('躺平');tapVibrate()">躺平</button>
      <button class="preset-btn" ontouchstart="" onclick="loadPreset('自律达人');tapVibrate()">自律达人</button>
      <button class="preset-btn" ontouchstart="" onclick="loadPreset('人生赢家');tapVibrate()">人生赢家</button>
    </div>
  </div>

  <!-- Calculate -->
  <div class="calc-wrap">
    <button class="btn-calc" id="calcBtn" ontouchstart="" onclick="calculate();tapVibrate()" disabled>开始分析人生 ROI</button>
  </div>

  <!-- Results -->
  <div id="results" class="results">

    <div class="card">
      <div class="card-title">🎯 评分</div>
      <div class="score-hero">
        <div class="score-ring" id="scoreRing">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle class="ring-bg" cx="70" cy="70" r="58"/>
            <circle class="ring-fill" id="ringFill" cx="70" cy="70" r="58"
              stroke="#fb923c" stroke-dasharray="364" stroke-dashoffset="364"/>
          </svg>
          <div class="score-label">
            <div class="num" id="scoreNum">--</div>
            <div class="grade" id="scoreGrade">--</div>
          </div>
        </div>
        <div class="score-text" id="scoreDesc">点击"开始分析"查看你的人生投资回报率</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 关键指标</div>
      <div class="metric-grid" id="metricGrid"></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
      <div class="card" style="margin:0;">
        <div class="card-title">⏳ 时间分配</div>
        <div id="allocContent"><div class="skeleton">暂无数据</div></div>
      </div>
      <div class="card" style="margin:0;">
        <div class="card-title">⚠️ 风险提示</div>
        <div id="riskContent"><div class="skeleton">暂无数据</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📄 投资建议</div>
      <div id="verdictContent"></div>
      <div id="tipsContent" style="margin-top:16px;"></div>
    </div>
  </div>

  <div class="footer">人生有风险，活着需谨慎 · 本报告仅供娱乐</div>
</div>

<script>
// ===== Vibration + Ripple =====
function tapVibrate() {
  if (navigator.vibrate) navigator.vibrate(8);
}

function ripple(e) {
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - size / 2;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top - size / 2;
  const el = document.createElement('span');
  el.className = 'ripple';
  el.style.width = el.style.height = size + 'px';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  btn.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// Attach ripple to all touch buttons
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[ontouchstart]').forEach(el => {
    el.addEventListener('touchstart', ripple);
    el.addEventListener('mousedown', ripple);
  });
  document.getElementById('habitName').addEventListener('keydown', e => {
    if (e.key === 'Enter') addHabit();
  });
});

// ===== Auto Classification =====
function classify(name) {
  const n = name.trim().toLowerCase();

  const investKW = [
    '健身','跑步','锻炼','运动','撸铁','瑜伽','游泳','跳绳','打球','跑步机',
    '学习','读书','阅读','看书','上课','听课','复习','备考','背单词','练习','写作','写代码','编程','创作',
    '冥想','正念','复盘','计划','规划','思考','反思','日记','做项目','深度工作'
  ];
  const socialKW = [
    '陪家人','陪父母','陪孩子','陪对象','陪女朋友','陪男朋友','陪老婆','陪老公','陪娃','带娃',
    '约会','聚餐','聊天','社交','聚会','串门','拜访','电话','视频','和朋友','和同学','和同事',
    '谈恋爱','相亲','交友'
  ];
  const maintKW = [
    '睡觉','睡眠','午睡','休息','打盹','闭目养神',
    '吃饭','早餐','午餐','晚餐','做饭','煮饭','烹饪','进食','喝水',
    '洗漱','洗澡','洗头','刷牙','护肤','化妆','打扮','穿衣','换衣服','上厕所',
    '看病','体检','理疗','按摩','spa'
  ];
  const funKW = [
    '追剧','看剧','看电影','看视频','看动漫','看番','刷剧','看综艺','看纪录片',
    '打游戏','玩游戏','王者','吃鸡','原神','lol','英雄联盟','steam','switch','ps5','ns',
    '听歌','听音乐','看小说','刷小说','看漫画','刷漫画',
    '逛街','购物','淘宝','京东','拼多多','刷淘宝','买东西','逛商场',
    '旅游','旅行','出去玩','去玩','散步','遛弯','逛公园','遛狗'
  ];
  const wasteKW = [
    '刷短视频','刷抖音','刷快手','刷b站','刷bilibili','刷视频','刷手机','刷微博','刷小红书','刷ins','刷朋友圈',
    '刷贴吧','刷知乎','刷头条','刷资讯','刷新闻','刷ig','刷tiktok','玩手机','看手机',
    '刷直播','看直播','刷淘宝','刷京东','刷拼多多'
  ];
  const drainKW = [
    '加班','内耗','拖延','摸鱼','发呆','摆烂','躺床发呆','焦虑','emo',
    '无效社交','开会','开无聊的会'
  ];
  const choreKW = [
    '通勤','坐车','开车','地铁','公交','骑车','赶路','路上',
    '家务','扫地','拖地','洗碗','洗衣服','整理','收纳','打扫','擦桌子','倒垃圾','买菜','做家务',
    '排队','等待','候车','候机','挂号','拿快递','取快递','拿外卖',
    '遛狗','养猫','喂猫','喂狗'
  ];

  for (const kw of drainKW)   { if (n.includes(kw)) return 'liability'; }
  for (const kw of wasteKW)   { if (n.includes(kw)) return 'depreciation'; }
  for (const kw of investKW)  { if (n.includes(kw)) return 'investment'; }
  for (const kw of socialKW)  { if (n.includes(kw)) return 'dividend'; }
  for (const kw of funKW)     { if (n.includes(kw)) return 'expense'; }
  for (const kw of choreKW)   { if (n.includes(kw)) return 'operating'; }
  for (const kw of maintKW)   { if (n.includes(kw)) return 'maintenance'; }

  if (n.includes('班') || n.includes('工') || n.includes('作') || n.includes('职')) return 'investment';
  return 'expense';
}

function getBadge(type) {
  const map = {
    investment:    { label: '📈 增值', color: '#ca8a04', bg: '#fef7e6' },
    dividend:      { label: '💛 社交', color: '#b45309', bg: '#fef3e2' },
    maintenance:   { label: '🔋 维护', color: '#2563eb', bg: '#eef2ff' },
    expense:       { label: '🎮 娱乐', color: '#7c3aed', bg: '#f5f0ff' },
    depreciation:  { label: '📉 消耗', color: '#dc2626', bg: '#fef2f2' },
    liability:     { label: '⛓️ 损耗', color: '#b91c1c', bg: '#fef2f2' },
    operating:     { label: '📋 杂务', color: '#78716c', bg: '#f5f5f4' },
  };
  return map[type] || map.expense;
}

const CAT = {
  investment:    { coeff: 1.8, color: '#ca8a04', label: '增值' },
  dividend:      { coeff: 1.3, color: '#b45309', label: '社交' },
  maintenance:   { coeff: 0.9, color: '#2563eb', label: '维护' },
  expense:       { coeff: 0.5, color: '#7c3aed', label: '娱乐' },
  depreciation:  { coeff: 0.15, color: '#dc2626', label: '消耗' },
  liability:     { coeff: -0.3, color: '#b91c1c', label: '损耗' },
  operating:     { coeff: 0.4, color: '#78716c', label: '杂务' },
};
const CAT_KEYS = Object.keys(CAT);

let habits = [];
let currentTime = 1;

function adjTime(delta) {
  currentTime = Math.max(0.5, Math.min(16, currentTime + delta));
  document.getElementById('timeDisplay').textContent = currentTime;
}

function addHabit() {
  const nameEl = document.getElementById('habitName');
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); shake(nameEl); return; }
  const type = classify(name);
  habits.push({ name, hours: currentTime, type });
  nameEl.value = '';
  nameEl.focus();
  renderTags();
  enableCalc();
}

function removeHabit(i) {
  habits.splice(i, 1);
  renderTags();
  enableCalc();
}

function clearHabits() {
  if (habits.length === 0) return;
  habits = [];
  renderTags();
  enableCalc();
}

function renderTags() {
  const el = document.getElementById('tagList');
  el.innerHTML = habits.map((h, i) => {
    const badge = getBadge(h.type);
    return `<span class="tag" style="background:${badge.bg};color:${badge.color};border:1px solid ${badge.bg}">
      ${badge.label} ${h.name} ${h.hours}h
      <button class="remove" ontouchstart="" onclick="removeHabit(${i});tapVibrate()">✕</button>
    </span>`;
  }).join('');
}

function enableCalc() {
  document.getElementById('calcBtn').disabled = habits.length === 0;
}

function shake(el) {
  el.style.borderColor = '#ef4444';
  el.style.animation = 'none';
  void el.offsetHeight;
  el.style.animation = 'shake 0.3s ease';
  setTimeout(() => el.style.borderColor = '', 500);
}
const styleShake = document.createElement('style');
styleShake.textContent = `@keyframes shake { 0%,100% { transform:translateX(0) } 25% { transform:translateX(-7px) } 50% { transform:translateX(7px) } }`;
document.head.appendChild(styleShake);

const PRESETS = {
  '打工人': [
    ['睡觉',7], ['吃饭洗漱',1.5], ['上班',9],
    ['通勤',1.5], ['刷手机',2], ['追剧',1],
    ['发呆拖延',1], ['社交',0.5], ['家务',0.5]
  ],
  '卷王': [
    ['睡觉',5.5], ['吃饭',1], ['加班工作',13],
    ['通勤',1], ['健身',0.5], ['学习',1],
    ['刷资讯',1], ['社交',0.5], ['洗漱',0.5]
  ],
  '躺平': [
    ['睡觉',9], ['吃饭',2], ['刷短视频',4],
    ['打游戏',3], ['追剧',2], ['躺床发呆',2],
    ['吃零食',1], ['拿外卖',0.5], ['洗澡',0.5]
  ],
  '自律达人': [
    ['睡觉',7.5], ['健身',1.5], ['学习阅读',2.5],
    ['工作',7], ['冥想',0.5], ['做饭',1],
    ['陪家人',1.5], ['社交',1], ['爱好',1], ['洗漱',0.5]
  ],
  '人生赢家': [
    ['睡觉',7], ['锻炼',1], ['深度工作',6],
    ['学习',1.5], ['陪家人',2], ['社交',1.5],
    ['创作创业',2], ['阅读',1], ['休闲',1], ['吃饭洗漱',1]
  ]
};

function loadPreset(name) {
  habits = (PRESETS[name] || []).map(d => {
    const type = classify(d[0]);
    return { name: d[0], hours: d[1], type };
  });
  renderTags();
  enableCalc();
  calculate();
}

function calculate() {
  if (habits.length === 0) return;

  const results = document.getElementById('results');
  results.style.display = 'block';
  setTimeout(() => results.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);

  const total = habits.reduce((s, h) => s + h.hours, 0);
  const groups = {};
  CAT_KEYS.forEach(k => { groups[k] = { hours: 0, items: [] }; });
  habits.forEach(h => {
    if (!groups[h.type]) groups[h.type] = { hours: 0, items: [] };
    groups[h.type].hours += h.hours;
    groups[h.type].items.push(h);
  });

  let weighted = 0, totalW = 0;
  CAT_KEYS.forEach(k => {
    if (groups[k].hours > 0) { weighted += groups[k].hours * CAT[k].coeff; totalW += groups[k].hours; }
  });
  const avgROI = totalW > 0 ? weighted / totalW : 0;

  let score = (avgROI + 0.5) / 2.3 * 100;
  const depH = groups.depreciation?.hours || 0;
  const liaH = groups.liability?.hours || 0;
  const invH = groups.investment?.hours || 0;
  const sleepH = groups.maintenance?.items?.filter(i => i.name.includes('睡') || i.name.includes('眠') || i.name.includes('盹'))?.reduce((s,i) => s+i.hours, 0) || 0;

  score -= depH * 5;
  score -= liaH * 5;
  score += invH * 2;
  if (sleepH > 0 && sleepH < 6) score -= (6 - sleepH) * 5;
  score = Math.max(0, Math.min(100, score));

  let grade, gCls;
  if (score >= 80) { grade = '优秀'; gCls = 'verdict-good'; }
  else if (score >= 60) { grade = '良好'; gCls = 'verdict-good'; }
  else if (score >= 40) { grade = '一般'; gCls = 'verdict-meh'; }
  else { grade = '堪忧'; gCls = 'verdict-bad'; }

  renderScore(score, grade);
  renderMetrics(score, avgROI, invH, depH + liaH, total);
  renderAllocation(groups, total);
  renderRisks(groups, score, sleepH, total);
  renderVerdict(score, grade, gCls, invH, depH, liaH, sleepH, groups, total);
}

function renderScore(score, grade) {
  const circ = 2 * Math.PI * 58;
  const offset = circ - (score / 100) * circ;
  const fill = document.getElementById('ringFill');
  fill.style.strokeDashoffset = offset;
  let color;
  if (score >= 60) color = '#ca8a04';
  else if (score >= 35) color = '#b45309';
  else color = '#dc2626';
  fill.setAttribute('stroke', color);
  document.getElementById('scoreNum').textContent = Math.round(score);
  document.getElementById('scoreNum').style.color = color;
  document.getElementById('scoreGrade').textContent = grade;
  document.getElementById('scoreGrade').style.color = color;

  let desc;
  if (score >= 80) desc = '你是 <strong>蓝筹资产</strong>，时间配置科学合理，具备长期竞争优势。';
  else if (score >= 60) desc = '时间配置 <strong>基本健康</strong>，减少消耗类活动即可更上一层楼。';
  else if (score >= 40) desc = '存在 <strong>结构性风险</strong>，不良资产偏高，建议重新配置时间组合。';
  else desc = '时间资产负债表 <strong>严重承压</strong>，消耗和损耗类占据主导。';
  document.getElementById('scoreDesc').innerHTML = desc;
}

function renderMetrics(score, roi, invH, badH, total) {
  const eff = total > 0 ? ((invH / total) * 100) : 0;
  const badPct = total > 0 ? ((badH / total) * 100) : 0;
  const yearly = Math.pow(1 + roi, 365) - 1;
  document.getElementById('metricGrid').innerHTML = `
    <div class="metric">
      <div class="m-label">增值效率</div>
      <div class="m-value" style="color:${eff > 30 ? '#ca8a04' : '#b45309'}">${eff.toFixed(0)}%</div>
      <div class="m-sub">增值活动占比</div>
    </div>
    <div class="metric">
      <div class="m-label">不良率</div>
      <div class="m-value" style="color:${badPct < 20 ? '#ca8a04' : '#dc2626'}">${badPct.toFixed(0)}%</div>
      <div class="m-sub">消耗+损耗占比</div>
    </div>
    <div class="metric">
      <div class="m-label">年化复利</div>
      <div class="m-value" style="color:${yearly > 0 ? '#ca8a04' : '#dc2626'}">${yearly > 0 ? '+' : ''}${(yearly * 100).toFixed(0)}%</div>
      <div class="m-sub">基于日回报率滚动</div>
    </div>
  `;
}

function renderAllocation(groups, total) {
  const sorted = CAT_KEYS.filter(k => groups[k].hours > 0).sort((a,b) => groups[b].hours - groups[a].hours);
  const el = document.getElementById('allocContent');
  if (sorted.length === 0) { el.innerHTML = '<div class="skeleton">暂无数据</div>'; return; }
  el.innerHTML = sorted.map(k => {
    const c = CAT[k];
    const pct = groups[k].hours / total * 100;
    return `<div class="alloc-item">
      <span class="dot" style="background:${c.color}"></span>
      <span class="al-name">${c.label}</span>
      <span class="al-bar"><span class="al-bar-fill" style="width:${pct}%;background:${c.color}"></span></span>
      <span class="al-pct">${pct.toFixed(0)}%</span>
    </div>`;
  }).join('');
}

function renderRisks(groups, score, sleepH, total) {
  const el = document.getElementById('riskContent');
  const risks = [];
  const depPct = ((groups.depreciation?.hours || 0) / total) || 0;
  const liaPct = ((groups.liability?.hours || 0) / total) || 0;
  const invPct = ((groups.investment?.hours || 0) / total) || 0;
  if (depPct > 0.15) risks.push(['📉', '消耗类占 '+(depPct*100).toFixed(0)+'%，认知资本快速折旧中。']);
  if (liaPct > 0.10) risks.push(['⛓️', '损耗类超出阈值，正在产生负收益。']);
  if (invPct < 0.15) risks.push(['📈', '增值类仅 '+(invPct*100).toFixed(0)+'%，长期将跑输大盘。']);
  if (sleepH > 0 && sleepH < 6) risks.push(['🔴', '睡眠仅 '+sleepH.toFixed(1)+' 小时，宕机风险上升。']);
  if (score < 40) risks.push(['⚠️', '评分进入警戒区间。']);
  if (risks.length === 0) risks.push(['🟢', '风险可控，配置符合健康标准。']);
  el.innerHTML = risks.map(r => '<div class="risk-item"><span class="ri-icon">'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');
}

function renderVerdict(score, grade, gCls, invH, depH, liaH, sleepH, groups, total) {
  const el = document.getElementById('verdictContent');
  const tipsEl = document.getElementById('tipsContent');
  let icon, title, desc;
  if (score >= 80) { icon='🏆'; title='强烈买入 · '+grade; desc='你的人生是一支值得长期持有的优质资产。'; }
  else if (score >= 60) { icon='👍'; title='持有 · '+grade; desc='底子不错，减少消耗就能更上一层楼。'; }
  else if (score >= 40) { icon='🤔'; title='观望 · '+grade; desc='平庸但还有救，重新审视时间配置吧。'; }
  else { icon='🚨'; title='紧急处理 · '+grade; desc='建议立即启动人生资产重组计划。'; }
  el.innerHTML = '<div class="verdict-box '+gCls+'"><div class="v-icon">'+icon+'</div><div class="v-title">'+title+'</div><div class="v-desc">'+desc+'</div></div>';

  const tips = [];
  if (invH < 2) tips.push('📈 增加增值活动：每天至少 2 小时学习或锻炼。');
  if (depH > 1) tips.push('📉 减少消耗：刷社交媒体控制在 30 分钟以内。');
  if (liaH > 0.5) tips.push('⛓️ 止损损耗：无效加班和内耗是负资产。');
  if (sleepH > 0 && sleepH < 7) tips.push('😴 保证睡眠：7-8 小时不可压缩。');
  if ((groups.dividend?.hours||0) < 0.5) tips.push('💛 增加社交：陪家人朋友是低风险高回报资产。');
  if (tips.length > 0) { tipsEl.innerHTML = '<strong>💡 优化建议</strong><br>'+tips.join('<br>'); tipsEl.style.display='block'; }
  else { tipsEl.style.display='none'; }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/life-investment-calculator/sw.js');
}
