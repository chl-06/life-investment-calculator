<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#D4A373">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/life-investment-calculator/manifest.json?v=5">
<link rel="icon" href="/life-investment-calculator/icons/icon.svg?v=5" type="image/svg+xml">
<title>人生 ROI 计算器</title>
<style>
/* ==============================
   CSS Module 1: Design System
   ============================== */
:root {
  --paper-bg: #FAF9F6;
  --card-bg: #FFFFFF;
  --text-primary: #2D2D2D;
  --text-secondary: #6B7280;
  --muted: #9CA3AF;
  --accent-start: #D4A373;
  --accent-end: #C49363;
  --accent-hover: #BB8A52;
  --accent-light: rgba(212,163,115,0.12);
  --sage: #A5A58D;
  --sage-bg: rgba(165,165,141,0.12);
  --danger: #b85a5a;
  --danger-bg: rgba(184,90,90,0.08);
  --warning: #b89a5a;
  --warning-bg: rgba(184,154,90,0.08);
  --border-light: #f0f0f0;
  --border-input: #e5e5e5;
  --card-radius: 12px;
  --btn-radius: 8px;
  --card-shadow: rgba(149,157,165,0.10) 0 8px 24px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font-ui: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --font-serif: "Noto Serif SC","Source Han Serif SC",serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--paper-bg);
  color: var(--text-primary);
  font-family: var(--font-ui);
  line-height: 1.6;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 40px 16px calc(40px + var(--safe-bottom)) 16px;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  overscroll-behavior: auto;
}

/* ==============================
   CSS Module 2: Layout
   ============================== */
.container {
  background: var(--card-bg);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  padding: 40px 36px;
  max-width: 480px;
  width: 100%;
  border: 1px solid rgba(0,0,0,0.02);
}

h1 {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 2px;
  border-bottom: 2px solid var(--accent-start);
  display: inline-block;
  padding-bottom: 8px;
  margin-bottom: 24px;
  color: var(--text-primary);
}

.subtitle {
  color: var(--text-secondary);
  font-size: 13px;
  margin-bottom: 28px;
  letter-spacing: 0.5px;
}

/* ==============================
   CSS Module 3: Tab System
   ============================== */
.tab-bar {
  display: flex;
  border-bottom: 2px solid var(--border-light);
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  background: none;
  color: var(--text-secondary);
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  transition: color 0.2s, border-color 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.tab.active {
  color: var(--accent-start);
  border-bottom-color: var(--accent-start);
  font-weight: 700;
}
.section { display: none; }
.section.active { display: block; }

/* ==============================
   CSS Module 4: Form Controls
   ============================== */
.input-group { margin-bottom: 16px; position: relative; }
.input-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

input {
  width: 100%;
  background: #fcfcfc;
  border: 1.5px solid var(--border-input);
  border-radius: var(--btn-radius);
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}
input:focus {
  border-color: var(--accent-start);
  background: #fff;
  box-shadow: 0 0 0 3px var(--accent-light);
}
input[type="number"] { padding: 10px 12px; }

.input-row { display: flex; gap: 8px; margin-bottom: 10px; }
.input-row input { flex: 1; min-width: 0; }

.time-picker {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  background: #fcfcfc;
  border: 1.5px solid var(--border-input);
  border-radius: var(--btn-radius);
  flex-shrink: 0;
}
.time-picker button {
  width: 36px;
  height: 36px;
  padding: 0;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  font-weight: 400;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.time-picker button:active { background: var(--border-light); }
.time-picker span {
  min-width: 30px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

/* ==============================
   CSS Module 5: Buttons
   ============================== */
button {
  background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
  border: none;
  border-radius: var(--btn-radius);
  padding: 14px 20px;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-size: 13px;
  font-family: inherit;
  transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
  box-shadow: 0 4px 14px rgba(212,163,115,0.2);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  position: relative;
  overflow: hidden;
}
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-full { width: 100%; }

.btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
.btn-row button { flex: 1; }

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  box-shadow: none;
  border: 1.5px solid var(--border-light);
  text-transform: none;
  letter-spacing: 0;
  font-weight: 500;
}
.btn-ghost:active { background: #f8f8f8; border-color: #ddd; }

.preset-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
}
.preset-btn {
  padding: 5px 12px;
  font-size: 11px;
  background: #f8f8f8;
  color: var(--text-secondary);
  box-shadow: none;
  text-transform: none;
  letter-spacing: 0;
  border: 1px solid var(--border-light);
  font-weight: 400;
  width: auto;
}
.preset-btn:active { background: #eee; }

.btn-calc { margin: 10px 0 0; }

.share-btn {
  width: 100%;
  margin: 10px 0 0;
  padding: 14px;
  background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
  color: #fff;
  box-shadow: 0 4px 14px rgba(212,163,115,0.2);
  text-transform: none;
  letter-spacing: 0.5px;
  font-size: 13px;
  font-weight: 600;
}

/* ==============================
   CSS Module 6: Tags
   ============================== */
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 36px;
  margin: 12px 0 10px;
}
.tag-list:empty::after {
  content: '还没有添加行为 \270D\FE0F 输入日常事项后点添加';
  color: #ccc;
  font-size: 12px;
  padding: 8px 0;
  width: 100%;
  text-align: center;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px 5px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid rgba(0,0,0,0.04);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tag button {
  background: none;
  color: inherit;
  padding: 0 2px;
  font-size: 11px;
  box-shadow: none;
  letter-spacing: 0;
  text-transform: none;
  width: auto;
  opacity: 0.5;
}
.tag button:active { opacity: 1; }

/* ==============================
   CSS Module 7: Results
   ============================== */
.result-section { display: none; margin-top: 24px; }
.result-section.show { display: block; }

.result-box {
  background: #fdfaf7;
  border-radius: var(--btn-radius);
  padding: 20px;
  border-left: 5px solid var(--accent-start);
  margin-bottom: 12px;
}
.result-main {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  color: var(--sage);
  font-weight: 700;
  margin-top: 4px;
  line-height: 1.3;
}
.result-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }

.stat-box {
  background: #fdfaf7;
  border-radius: var(--btn-radius);
  padding: 14px 10px;
  text-align: center;
}
.stat-box .s-label {
  font-size: 10px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.stat-box .s-value {
  font-size: 20px;
  font-weight: 700;
  margin-top: 2px;
  font-family: var(--font-serif);
}
.stat-box .s-sub {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ==============================
   CSS Module 8: Panels & Allocation
   ============================== */
.panel {
  background: #fdfaf7;
  border-radius: var(--btn-radius);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.panel-title {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.alloc-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 12px;
  border-bottom: 1px solid rgba(0,0,0,0.04);
}
.alloc-item:last-child { border-bottom: none; }
.alloc-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.alloc-item .al-name { flex: 1; }
.alloc-item .al-bar { flex: 2; height: 5px; background: #eee; border-radius: 3px; overflow: hidden; }
.alloc-item .al-bar-fill { height: 100%; border-radius: 3px; }
.alloc-item .al-pct { min-width: 32px; text-align: right; font-weight: 600; font-size: 11px; color: var(--text-secondary); }

.risk-item {
  display: flex; gap: 8px; padding: 4px 0;
  font-size: 12px; color: var(--text-secondary);
  border-bottom: 1px solid rgba(0,0,0,0.04);
}
.risk-item:last-child { border-bottom: none; }

/* ==============================
   CSS Module 9: Verdict & Tips
   ============================== */
.verdict-box {
  text-align: center;
  padding: 20px 16px;
  border-radius: var(--btn-radius);
  margin-bottom: 10px;
}
.verdict-box .v-icon { font-size: 36px; }
.verdict-box .v-title { font-family: var(--font-serif); font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
.verdict-box .v-desc { font-size: 13px; opacity: 0.75; }
.verdict-good { background: #f5f3ee; color: #7a7a5a; }
.verdict-meh { background: #faf6ed; color: #9a8a5a; }
.verdict-bad { background: #faf0ee; color: #9a5a5a; }

.tips-box {
  background: #f5f3ee;
  border-left: 4px solid var(--accent-start);
  border-radius: 6px;
  padding: 14px 16px;
  font-size: 12px;
  line-height: 1.8;
  color: #5a5a4a;
}
.tips-box strong { color: var(--text-primary); }

.warn-banner {
  background: var(--warning-bg);
  border-left: 4px solid #e8c84a;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 12px;
  color: #8a7a3a;
  margin-bottom: 10px;
  display: none;
}
.warn-banner.show { display: block; }

.algo-toggle {
  background: none;
  border: none;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 8px 0;
  width: 100%;
  text-align: left;
  font-family: inherit;
  letter-spacing: 0;
  text-transform: none;
  box-shadow: none;
}
.algo-details {
  display: none;
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.7;
  background: #fafaf8;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.algo-details.show { display: block; }
.algo-details .algo-row { display: flex; justify-content: space-between; padding: 1px 0; }
.algo-details .algo-total { border-top: 1px solid var(--border-light); margin-top: 4px; padding-top: 4px; font-weight: 600; color: var(--text-primary); }

/* ==============================
   CSS Module 10: Plans
   ============================== */
.plan-list { margin: 8px 0 10px; max-height: 360px; overflow-y: auto; }
.plan-list:empty { display: none; }
.plan-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: var(--btn-radius);
  background: #fafaf8;
  border: 1px solid var(--border-light);
  margin-bottom: 4px;
  cursor: pointer;
  transition: background 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.plan-item:active { background: #f0f0ee; }
.plan-item .pi-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-item .pi-detail { font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
.plan-item .pi-del {
  background: none;
  border: none;
  color: #ccc;
  font-size: 14px;
  padding: 4px 6px;
  cursor: pointer;
  border-radius: 4px;
}
.plan-item .pi-del:active { color: var(--danger); background: #f5f5f5; }

.plan-save-row { display: flex; gap: 6px; margin: 4px 0 0; }
.plan-save-row input { flex: 1; padding: 10px 12px; font-size: 13px; }

/* ==============================
   CSS Module 11: Comparison Mode
   ============================== */
.cmp-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 10px 0 6px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cmp-toggle input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent-start); }
.cmp-section { display: none; margin-top: 2px; }
.cmp-section.show { display: block; }
.grid-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.cmp-col .col-title { font-size: 10px; font-weight: 600; text-align: center; padding: 4px 6px; border-radius: 4px; margin-bottom: 6px; }

/* ==============================
   CSS Module 12: Range Slider
   ============================== */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 5px;
  border-radius: 3px;
  background: var(--border-light);
  outline: none;
  padding: 0;
  border: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent-start);
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
input[type="range"]::-moz-range-thumb {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent-start);
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.range-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.range-label .r-val {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}

/* ==============================
   CSS Module 13: Chart
   ============================== */
.chart-wrap {
  background: #fafaf8;
  border-radius: 6px;
  padding: 8px;
  margin-top: 10px;
}
.chart-wrap canvas { width: 100%; height: auto; display: block; }

/* ==============================
   CSS Module 14: Modal & Overlay
   ============================== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-box {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
}
.modal-title { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 12px; }
.modal-scroll { overflow: auto; -webkit-overflow-scrolling: touch; }
.modal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.modal-table th {
  position: sticky;
  top: 0;
  background: #fafaf8;
  padding: 8px 6px;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 2px solid var(--border-light);
  text-align: right;
  font-size: 11px;
}
.modal-table th:first-child { text-align: center; }
.modal-table td { padding: 6px; text-align: right; border-bottom: 1px solid #f5f5f5; color: var(--text-primary); }
.modal-table td:first-child { text-align: center; color: var(--text-secondary); }
.modal-table tr:last-child td { border-bottom: none; }
.modal-table tr:last-child { font-weight: 700; color: var(--text-primary); }

.modal-close {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: #f5f5f5;
  color: var(--text-secondary);
  box-shadow: none;
  text-transform: none;
  letter-spacing: 0;
  font-size: 13px;
}
.modal-close:active { background: #eee; }
.modal-btn-row { display: flex; gap: 6px; margin-top: 12px; }
.modal-btn-row .modal-close { margin: 0; }
.modal-btn-row .modal-export { margin: 0; background: var(--sage-bg); color: var(--sage); }

/* ==============================
   CSS Module 15: Edit Popup
   ============================== */
.edit-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.25);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.edit-popup {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  width: 320px;
  max-width: 92vw;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
}
.edit-title { font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 14px; color: var(--text-primary); }
.edit-field { margin-bottom: 12px; }
.edit-field label { display: block; font-size: 11px; color: var(--text-secondary); font-weight: 600; margin-bottom: 4px; }
.edit-field input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border-input); border-radius: var(--btn-radius); font-size: 14px; font-family: inherit; outline: none; }
.edit-field input:focus { border-color: var(--accent-start); }
.edit-time-row { display: flex; align-items: center; gap: 8px; }
.edit-time-row button {
  width: 36px; height: 36px; padding: 0;
  background: #f5f5f5; color: var(--text-primary);
  font-size: 18px; font-weight: 600;
  border-radius: var(--btn-radius);
  border: 1.5px solid var(--border-input);
  box-shadow: none;
}
.edit-time-row button:active { background: #eee; }
.edit-time-row .et-display { flex: 1; text-align: center; font-size: 18px; font-weight: 700; }
.edit-cat-title { font-size: 11px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; }
.edit-cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 12px; }
.edit-cat-btn {
  padding: 8px 6px;
  border-radius: 6px;
  border: 1.5px solid transparent;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.edit-cat-btn:active { transform: scale(0.95); }
.edit-btns { display: flex; gap: 8px; }
.edit-btns button { flex: 1; padding: 12px; font-size: 13px; text-transform: none; letter-spacing: 0; }
.edit-btns .btn-cancel { background: #f5f5f5; color: var(--text-secondary); box-shadow: none; }

/* ==============================
   CSS Module 16: About Modal
   ============================== */
.about-section { margin-bottom: 16px; }
.about-section h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border-light);
}
.about-section p {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.7;
}
.about-section .about-link {
  display: inline-block;
  margin-top: 4px;
  color: var(--accent-start);
  text-decoration: none;
  font-size: 12px;
}
.about-version {
  text-align: center;

<script>
'use strict';

/* --- Floating-point precision --- */
function roundTo(n, dec) {
  const f = Math.pow(10, dec);
  return Math.round((n + Number.EPSILON) * f) / f;
}

/* --- Format helpers --- */
function formatMoney(n) {
  if (Math.abs(n) >= 1e8) return roundTo(n / 1e8, 2) + ' 亿';
  if (Math.abs(n) >= 1e4) return roundTo(n / 1e4, 2) + ' 万';
  return '¥' + roundTo(n, 2);
}

function shortNum(n) {
  if (n >= 1e8) return roundTo(n / 1e8, 1) + '亿';
  if (n >= 1e4) return roundTo(n / 1e4, 1) + '万';
  if (n >= 1000) return roundTo(n / 1000, 1) + 'k';
  return n.toFixed(0);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* --- Input validation --- */
function validateInput(value, opts = {}) {
  const { min, max, required } = opts;
  if (required && (value === undefined || value === null || String(value).trim() === '')) {
    return { valid: false, msg: '此项为必填' };
  }
  const num = parseFloat(value);
  if (isNaN(num)) return { valid: false, msg: '请输入有效数字' };
  if (min !== undefined && num < min) return { valid: false, msg: '最小值 ' + min };
  if (max !== undefined && num > max) return { valid: false, msg: '最大值 ' + max };
  return { valid: true, value: num };
}
</script>

<script>
'use strict';

/* --- Read all compound params --- */
function readCompoundParams() {
  const principal = Math.max(0, parseFloat(document.getElementById('cp-principal').value) || 0);
  const monthly   = Math.max(0, parseFloat(document.getElementById('cp-monthly').value) || 0);
  const years     = Math.min(50, Math.max(1, parseInt(document.getElementById('cp-years').value) || 10));
  const rate      = Math.min(0.30, Math.max(0, parseFloat(document.getElementById('cp-rate').value) / 100)) || 0;
  const inflation = Math.min(0.20, Math.max(0, parseFloat(document.getElementById('cp-inflation').value) / 100)) || 0;
  const growth    = Math.min(0.20, Math.max(0, parseFloat(document.getElementById('cp-growth').value) / 100)) || 0;
  const cmpOn     = document.getElementById('cmpToggle').checked;
  const rate2     = cmpOn ? Math.min(0.30, Math.max(0, parseFloat(document.getElementById('cp-rate2').value) / 100)) || 0 : 0;
  return { principal, monthly, years, rate, inflation, growth, cmpOn, rate2 };
}

/* --- Compound calculation core --- */
function calcData(principal, monthly, years, rate, growth, inflation) {
  inflation = inflation || 0;
  const annualInvest = monthly * 12;
  let totalPrincipal = principal;
  let nominalTotal = principal;
  const data = [{ year: 0, principal: roundTo(principal,2), gain: 0, nominal: roundTo(principal,2), real: roundTo(principal,2), contrib: 0, annualReturn: 0 }];

  for (let y = 1; y <= years; y++) {
    const contrib = roundTo(annualInvest * Math.pow(1 + growth, y - 1), 2);
    totalPrincipal = roundTo(totalPrincipal + contrib, 2);
    const prevNominal = nominalTotal;
    nominalTotal = roundTo((nominalTotal + contrib) * (1 + rate), 2);
    const prevGain = data[y-1] ? Math.max(0, data[y-1].nominal - data[y-1].principal) : 0;
    const currentGain = Math.max(0, nominalTotal - totalPrincipal);
    const annualReturn = roundTo(currentGain - prevGain, 2);

    data.push({
      year: y,
      principal: roundTo(totalPrincipal, 2),
      gain: roundTo(currentGain, 2),
      nominal: roundTo(nominalTotal, 2),
      real: roundTo(nominalTotal / Math.pow(1 + inflation, y), 2),
      contrib: roundTo(contrib, 2),
      annualReturn: annualReturn
    });
  }
  return data;
}

/* --- ROI scoring engine --- */
function calculateROI(habits) {
  const total = habits.reduce((s, h) => s + h.hours, 0);
  const groups = {};
  CAT_KEYS.forEach(k => { groups[k] = { hours: 0, items: [] }; });

  habits.forEach(h => {
    const t = h.type || 'expense';
    if (!groups[t]) groups[t] = { hours: 0, items: [] };
    groups[t].hours += h.hours;
    groups[t].items.push(h);
  });

  // Weighted score
  let w = 0, tw = 0;
  CAT_KEYS.forEach(k => {
    if (groups[k].hours > 0) {
      w += groups[k].hours * CAT[k].coeff;
      tw += groups[k].hours;
    }
  });
  const avg = tw > 0 ? w / tw : 0;
  let score = (avg + 0.5) / 2.3 * 100;

  const dH = groups.depreciation ? groups.depreciation.hours : 0;
  const lH = groups.liability ? groups.liability.hours : 0;
  const iH = groups.investment ? groups.investment.hours : 0;
  const sleepHours = groups.maintenance ?
    groups.maintenance.items.filter(i => /睡/.test(i.name)).reduce((s, i) => s + i.hours, 0) : 0;

  score -= dH * 5 + lH * 5 - iH * 2;
  if (sleepHours > 0 && sleepHours < 6) score -= (6 - sleepHours) * 5;
  score = Math.max(0, Math.min(100, score));

  // Grade
  let grade, gCls, color, icon, title, desc;
  if (score >= 80)      { grade='优秀 · 蓝筹资产'; gCls='verdict-good'; color='#7a7a5a'; icon='🏛️'; title='优质资产'; desc='你的人生是一支值得长期持有的核心资产。'; }
  else if (score >= 60) { grade='良好 · 可持有';   gCls='verdict-good'; color='#7a7a5a'; icon='📄'; title='可持有'; desc='底子不错，减少消耗类活动即可提升评级。'; }
  else if (score >= 40) { grade='一般 · 观望';     gCls='verdict-meh';  color='#9a8a5a'; icon='🔍'; title='列入观察'; desc='平庸但有优化空间，重新审视时间配置。'; }
  else                  { grade='堪忧 · 需重组';    gCls='verdict-bad';  color='#9a5a5a'; icon='⚠️'; title='需重组'; desc='建议立即启动人生资产重组计划。'; }

  const eff = total > 0 ? roundTo(iH / total * 100, 1) : 0;
  const bad = total > 0 ? roundTo((dH + lH) / total * 100, 1) : 0;
  const yr = Math.pow(1 + avg, 365) - 1;

  // Risk analysis
  const risks = [];
  if (dH / total > 0.15) risks.push(['📉','消耗类占比偏高，认知资本折旧加速']);
  if (lH / total > 0.10) risks.push(['⛓️','损耗类超阈值，产生负收益']);
  if (iH / total < 0.15) risks.push(['📈','增值类不足，长期跑输大盘']);
  if (sleepHours > 0 && sleepHours < 6) risks.push(['🔴','睡眠仅'+sleepHours.toFixed(1)+'小时，有宕机风险']);
  if (risks.length === 0) risks.push(['🟢','风险可控，时间配置健康']);

  // Tips
  const tips = [];
  if (iH < 2) tips.push('📈 增加增值活动：每天至少投入 2 小时在学习和锻炼上');
  if (dH > 1) tips.push('📉 减少消耗：刷社交媒体控制在 30 分钟以内');
  if (lH > 0.5) tips.push('⛓️ 止损损耗：无效加班和内耗是负资产');
  if (sleepHours > 0 && sleepHours < 7) tips.push('😴 保证睡眠：7-8 小时不可压缩');
  if ((groups.dividend ? groups.dividend.hours : 0) < 0.5) tips.push('💛 增加社交：陪伴家人是低风险高回报资产');

  // Algo details data
  const algoRows = [];
  CAT_KEYS.forEach(k => {
    if (groups[k].hours > 0) {
      algoRows.push({
        label: CAT_CN[k] + ' ' + groups[k].hours.toFixed(1) + 'h × ' + CAT[k].coeff,
        value: (groups[k].hours * CAT[k].coeff >= 0 ? '+' : '') + roundTo(groups[k].hours * CAT[k].coeff, 2)
      });
    }
  });
  const adjustments = [];
  if (dH > 0) adjustments.push({ label: '消耗惩罚 (' + dH.toFixed(1) + 'h × -5)', value: '-' + (dH * 5) });
  if (lH > 0) adjustments.push({ label: '损耗惩罚 (' + lH.toFixed(1) + 'h × -5)', value: '-' + (lH * 5) });
  if (iH > 0) adjustments.push({ label: '增值奖励 (' + iH.toFixed(1) + 'h × +2)', value: '+' + (iH * 2) });
  if (sleepHours > 0 && sleepHours < 6) adjustments.push({ label: '睡眠不足 (' + sleepHours.toFixed(1) + 'h, 差 ' + (6-sleepHours).toFixed(1) + 'h)', value: '-' + roundTo((6 - sleepHours) * 5, 1) });

  return {
    score: Math.round(score), grade, gCls, color, icon, title, desc,
    eff, bad, yr, avg, groups, total, risks, tips,
    algoRows, adjustments, baseScore: ((avg + 0.5) / 2.3 * 100).toFixed(1),
    dH, lH, iH, sleepHours
  };
}
</script>

<!-- ============================================================
     JavaScript Module 4: Services (Store, Haptics, Actions)
     ============================================================ -->
<script>
'use strict';

/* --- Store: localStorage wrapper --- */
const Store = {
  _prefix: 'lifeRoi_',

  getHabits() {
    try {
      const d = localStorage.getItem(this._prefix + 'habits');
      return d ? JSON.parse(d) : [];
    } catch(e) { return []; }
  },
  setHabits(h) {
    try { localStorage.setItem(this._prefix + 'habits', JSON.stringify(h)); } catch(e) {}
  },
  getPlans() {
    try {
      const d = localStorage.getItem(this._prefix + 'plans');
      return d ? JSON.parse(d) : [];
    } catch(e) { return []; }
  },
  setPlans(p) {
    try { localStorage.setItem(this._prefix + 'plans', JSON.stringify(p)); } catch(e) {}
  }
};

/* --- Haptics: vibration + audio feedback --- */
const Haptics = {
  _ctx: null,
  _inited: false,

  init() {
    if (this._inited) return;
    this._inited = true;
    try { this._ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    document.addEventListener('touchstart', () => this._resume(), { once: true });
    document.addEventListener('click', () => this._resume(), { once: true });
  },

  _resume() {
    if (this._ctx && this._ctx.state === 'suspended') this._ctx.resume();
  },

  vibrate(ms) {
    if ('vibrate' in navigator) {
      try { if (navigator.vibrate(ms)) return; } catch(e) {}
    }
    if (typeof ms === 'number' && ms <= 20) return;
    this._clickSound();
  },

  _clickSound() {
    try {
      this.init();
      if (!this._ctx) return;
      this._resume();
      const osc = this._ctx.createOscillator();
      const gain = this._ctx.createGain();
      osc.connect(gain);
      gain.connect(this._ctx.destination);
      osc.frequency.value = 800;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.08, this._ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this._ctx.currentTime + 0.06);
      osc.start(this._ctx.currentTime);
      osc.stop(this._ctx.currentTime + 0.06);
    } catch(e) {}
  }
};

/* --- Actions: event delegation system --- */
const Actions = {
  _registry: {},

  reg(name, fn) {
    this._registry[name] = fn;
  },

  handle(e) {
    const btn = e.target.closest('[data-click]');
    if (!btn) return;
    const action = btn.dataset.click;
    const handler = this._registry[action];
    if (handler) {
      handler(btn, e);
    }
  },

  init() {
    document.addEventListener('click', (e) => this.handle(e));
  }
};

/* --- Toast notification --- */
function showToast(msg) {
  const el = document.getElementById('toastEl');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  clearTimeout(el._removeTimer);
  el._hideTimer = setTimeout(() => {
    el.classList.remove('show');
  }, 1500);
}
</script>

<script>
'use strict';

/* ===== App State ===== */
let appHabits = [];
let curTime = 1;

// Compound calculation results cache
let compData = null;
let compData2 = null;

// Edit popup state
let editState = { idx: -1, time: 1, cat: 'expense' };

/* ===== Tag List Rendering ===== */
function renderTags() {
  const el = document.getElementById('tagList');
  if (!el) return;
  el.innerHTML = appHabits.map((h, i) => {
    const t = CAT[h.type] || CAT.expense;
    return '<span class="tag" data-click="showEdit" data-index="' + i + '" style="background:' + t.bg + ';color:' + t.color + ';border-color:' + t.color + '22">' +
      t.label + ' ' + escHtml(h.name) + ' ' + h.hours + 'h ' +
      '<button data-click="removeHabit" data-index="' + i + '">✕</button></span>';
  }).join('');
}

function updateCalcBtn() {
  const btn = document.getElementById('calcBtn');
  if (btn) btn.disabled = appHabits.length === 0;
}

/* ===== Sync Habits to Store ===== */
function syncHabits() {
  Store.setHabits(appHabits);
}

/* ===== Add / Remove / Clear Habits ===== */
Actions.reg('addHabit', () => {
  const el = document.getElementById('habitName');
  if (!el) return;
  const raw = el.value.trim();
  if (!raw) return;
  const items = raw.split(/[,，、;\n]+/).map(s => s.trim()).filter(Boolean);
  let added = 0;
  items.forEach(item => {
    const m = item.match(/^(.+?)\s*([\d.]+)\s*(?:h|小时|时)?$/);
    if (m) {
      const name = m[1].trim();
      const hours = Math.min(24, Math.max(0.5, parseFloat(m[2])));
      if (name) { appHabits.push({ name, hours, type: classify(name) }); added++; }
    } else {
      appHabits.push({ name: item, hours: Math.min(24, Math.max(0.5, curTime)), type: classify(item) });
      added++;
    }
  });
  el.value = '';
  el.focus();
  if (added) { renderTags(); updateCalcBtn(); syncHabits(); Haptics.vibrate(10); }
});

Actions.reg('removeHabit', (btn, e) => {
  e.stopPropagation();
  const i = parseInt(btn.dataset.index);
  if (isNaN(i)) return;
  appHabits.splice(i, 1);
  renderTags();
  updateCalcBtn();
  syncHabits();
  Haptics.vibrate(10);
  recalcIfVisible();
});

Actions.reg('clearHabits', () => {
  if (!appHabits.length) return;
  appHabits = [];
  renderTags();
  updateCalcBtn();
  syncHabits();
  document.getElementById('results').classList.remove('show');
  Haptics.vibrate(10);
});

/* ===== Time Picker ===== */
Actions.reg('adjTime', (btn) => {
  const d = parseFloat(btn.dataset.value) || 0;
  curTime = Math.max(0.5, Math.min(16, curTime + d));
  const el = document.getElementById('timeDisplay');
  if (el) el.textContent = curTime;
  Haptics.vibrate(10);
});

/* ===== Presets ===== */
Actions.reg('preset', (btn) => {
  const name = btn.dataset.preset;
  const preset = PRESETS[name];
  if (!preset) return;
  appHabits = preset.map(d => ({ name: d[0], hours: d[1], type: classify(d[0]) }));
  renderTags();
  updateCalcBtn();
  syncHabits();
  Haptics.vibrate(10);
  // Auto-calculate
  Actions._registry.calculate && Actions._registry.calculate();
});

/* ===== Tab Switching ===== */
Actions.reg('tab', (btn) => {
  const tab = btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + tab));
  const sub = document.getElementById('subtitle');
  if (sub) sub.textContent = tab === 'behavior' ? '用投资逻辑审视你的时间和金钱' : '用复利思维规划你的财富增长';
  Haptics.vibrate(10);
  if (tab === 'compound') {
    renderPlanList();
    setTimeout(() => {
      const c = document.getElementById('chartCanvas');
      if (c && compData) drawChart(compData, compData2);
    }, 100);
  }
});

/* ===== Modal Helpers ===== */
function openModal(html) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modalOv';
  ov.addEventListener('click', function(e) { if (e.target === ov) closeModal(); });
  ov.innerHTML = html;
  document.body.appendChild(ov);
}

function closeModal() {
  const el = document.getElementById('modalOv');
  if (el) el.remove();
}
Actions.reg('closeModal', closeModal);

/* ===== Edit Popup ===== */
Actions.reg('showEdit', (btn) => {
  const idx = parseInt(btn.dataset.index);
  if (isNaN(idx)) return;
  const h = appHabits[idx];
  if (!h) return;
  editState = { idx, time: h.hours, cat: h.type };

  const cats = [
    ['investment','📈 增值','#7a9a5a','#f2f5ee'],
    ['dividend','💛 社交','#b89a5a','#faf5ee'],
    ['maintenance','🔋 维护','#5a8aaa','#eef2f5'],
    ['expense','🎮 娱乐','#8a7aaa','#f2eef5'],
    ['depreciation','📉 消耗','#b85a5a','#f5eeee'],
    ['liability','⛓️ 损耗','#9a4a4a','#f5eeef'],
    ['operating','📋 杂务','#8a8a8a','#f2f2f2'],
  ];

  const catBtns = cats.map(c => {
    const sel = c[0] === h.type;
    return '<button class="edit-cat-btn" data-click="pickCat" data-cat="' + c[0] + '" style="background:' + c[3] + ';color:' + c[2] + (sel ? ';border-color:' + c[2] : '') + '">' + c[1] + '</button>';
  }).join('');

  const ov = document.createElement('div');
  ov.className = 'edit-overlay';
  ov.id = 'editOv';
  ov.addEventListener('click', function(e) { if (e.target === ov) closeEditPopup(); });
  ov.innerHTML =
    '<div class="edit-popup">' +
    '<div class="edit-title">✏️ 编辑行为</div>' +
    '<div class="edit-field"><label>行为名称</label><input id="editName" value="' + escHtml(h.name) + '" maxlength="40"></div>' +

    '<button data-click="adjEditTime" data-value="-0.5">−</button><span class="et-display" id="editTimeDisp">' + h.hours + '</span><button data-click="adjEditTime" data-value="0.5">+</button>' +
    '</div></div>' +
    '<div class="edit-cat-title">类别</div><div class="edit-cat-grid" id="editCatGrid">' + catBtns + '</div>' +
    '<div class="edit-btns"><button class="btn-cancel" data-click="cancelEdit">取消</button><button data-click="editSave">保存</button></div>' +
    '</div>';
  document.body.appendChild(ov);

  const nameEl = document.getElementById('editName');
  if (nameEl) { nameEl.focus(); nameEl.setSelectionRange(nameEl.value.length, nameEl.value.length); }

Actions.reg('pickCat', (btn) => {
  const cat = btn.dataset.cat;
  editState.cat = cat;
  const grid = document.getElementById('editCatGrid');
  if (!grid) return;
  Array.from(grid.children).forEach(b => { b.style.borderColor = 'transparent'; });
  btn.style.borderColor = btn.style.color;
});

Actions.reg('adjEditTime', (btn) => {
  const d = parseFloat(btn.dataset.value) || 0;
  editState.time = Math.max(0.5, Math.min(24, editState.time + d));
  const el = document.getElementById('editTimeDisp');
  if (el) el.textContent = editState.time;
});

Actions.reg('editSave', () => {
  const nameEl = document.getElementById('editName');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!name) return;
  const idx = editState.idx;
  if (idx < 0 || idx >= appHabits.length) return;
  appHabits[idx].name = name;
  appHabits[idx].hours = editState.time;
  appHabits[idx].type = editState.cat;
  closeEditPopup();
  renderTags();
  syncHabits();
  Haptics.vibrate(10);
  recalcIfVisible();
});

Actions.reg('cancelEdit', closeEditPopup);

function closeEditPopup() {
  const el = document.getElementById('editOv');
  if (el) el.remove();
  editState = { idx: -1, time: 1, cat: 'expense' };
}

function recalcIfVisible() {
  if (document.getElementById('results').classList.contains('show')) {
    Actions._registry.calculate && Actions._registry.calculate();
  }
}

/* ===== Calculate ROI ===== */
Actions.reg('calculate', () => {
  if (!appHabits.length) return;
  Haptics.vibrate(10);

  const r = document.getElementById('results');
  r.classList.add('show');
  setTimeout(() => r.scrollIntoView({ behavior: 'smooth' }), 50);

  const result = calculateROI(appHabits);

  // Score
  document.getElementById('scoreNum').textContent = result.score + ' 分';
  document.getElementById('scoreNum').style.color = result.color;
  document.getElementById('scoreGrade').textContent = result.grade;
  document.getElementById('scoreGrade').style.color = result.color;

  // Metrics
  document.getElementById('metricGrid').innerHTML =
    '<div class="stat-box"><div class="s-label">增值效率</div><div class="s-value" style="color:' + (result.eff>25 ? '#7a9a5a' : '#b89a5a') + '">' + result.eff + '%</div><div class="s-sub">增值占比</div></div>' +
    '<div class="stat-box"><div class="s-label">不良率</div><div class="s-value" style="color:' + (result.bad<20 ? '#7a9a5a' : '#b85a5a') + '">' + result.bad + '%</div><div class="s-sub">消耗+损耗</div></div>' +
    '<div class="stat-box"><div class="s-label">年化复利</div><div class="s-value" style="color:' + (result.yr>0 ? '#7a9a5a' : '#b85a5a') + '">' + (result.yr>0 ? '+' : '') + (result.yr*100).toFixed(0) + '%</div><div class="s-sub">日回报滚动</div></div>';

  // Allocation
  const sorted = CAT_KEYS.filter(k => result.groups[k].hours > 0).sort((a,b) => result.groups[b].hours - result.groups[a].hours);
  document.getElementById('allocContent').innerHTML = sorted.length
    ? sorted.map(k => {
        const pct = result.groups[k].hours / result.total * 100;
        return '<div class="alloc-item"><span class="dot" style="background:' + CAT[k].color + '"></span><span class="al-name">' + CAT_CN[k] + '</span><span class="al-bar"><span class="al-bar-fill" style="width:' + pct + '%;background:' + CAT[k].color + '"></span></span><span class="al-pct">' + pct.toFixed(0) + '%</span></div>';
      }).join('')
    : '<div style="color:#ccc;font-size:12px;text-align:center;padding:8px;">暂无数据</div>';

  // Risks
  document.getElementById('riskContent').innerHTML = result.risks.map(r => '<div class="risk-item"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>').join('');

  // Verdict
  document.getElementById('verdictContent').innerHTML =
    '<div class="verdict-box ' + result.gCls + '"><div class="v-icon">' + result.icon + '</div><div class="v-title">' + result.title + '</div><div class="v-desc">' + result.desc + '</div></div>';

  // Tips
  document.getElementById('tipsContent').innerHTML = result.tips.length
    ? '<div class="tips-box"><strong>💡 优化建议</strong><br>' + result.tips.join('<br>') + '</div>'
    : '';

  // 24h warning
  const warnEl = document.getElementById('warnBanner');
  if (result.total < 20 || result.total > 28) {
    warnEl.textContent = '⚠️ 总时长 ' + result.total.toFixed(1) + ' 小时偏离 24 小时较多（' +
      (result.total > 24 ? '超' + roundTo(result.total-24, 1) + 'h' : '缺' + roundTo(24-result.total, 1) + 'h') + '），请检查是否遗漏或重复录入';
    warnEl.classList.add('show');
  } else {
    warnEl.classList.remove('show');
  }

  // Algo details
  let algoHtml = result.algoRows.map(r => '<div class="algo-row"><span>' + r.label + '</span><span>' + r.value + '</span></div>').join('');
  algoHtml += '<div class="algo-row algo-total"><span>加权平均得分</span><span>' + result.avg.toFixed(3) + '</span></div>';
  algoHtml += '<div class="algo-row"><span>基础分 = (' + result.avg.toFixed(3) + ' + 0.5) / 2.3 × 100</span><span>' + result.baseScore + '</span></div>';
  result.adjustments.forEach(a => {
    algoHtml += '<div class="algo-row"><span>' + a.label + '</span><span>' + a.value + '</span></div>';
  });
  algoHtml += '<div class="algo-row algo-total"><span>最终得分</span><span>' + result.score + ' 分</span></div>';
  document.getElementById('algoDetails').innerHTML = algoHtml;
});

});

/* ===== Copy Results ===== */

  const parts = ['📊 人生 ROI 报告'];

  const grade = document.getElementById('scoreGrade').textContent;

function syncRangeDisplays() {
  document.querySelectorAll('input[type="range"][data-unit]').forEach(slider => {
    const displayId = slider.id + '-val';
    const display = document.getElementById(displayId);
    if (display) {
      const step = parseFloat(slider.step) || 1;
      const unit = slider.dataset.unit || '';
      const val = step >= 1 ? parseInt(slider.value) : parseFloat(slider.value).toFixed(1);
      display.textContent = val + ' ' + unit;
    }
  });
}

/* ===== Canvas Chart ===== */
function drawChart(data, data2) {
  const canvas = document.getElementById('chartCanvas');
  if (!canvas) return;
  const wrap = canvas.parentElement;
  const wrapW = wrap.clientWidth || 340;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(200, wrapW);
  const h = 240;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const P = { top: 20, right: 16, bottom: 28, left: 50 };
  const cw = w - P.left - P.right;
  const ch = h - P.top - P.bottom;

  // Find max across all series
  let maxVal = 0;
  if (data) data.forEach(d => { if (d.nominal > maxVal) maxVal = d.nominal; });
  if (data2) data2.forEach(d => { if (d.nominal > maxVal) maxVal = d.nominal; });
  if (maxVal > 0) {
    const order = Math.floor(Math.log10(maxVal));
    maxVal = Math.ceil(maxVal * 1.15 / Math.pow(10, order)) * Math.pow(10, order);
  }
  if (maxVal <= 0) maxVal = 1;

  const xf = i => P.left + (i / (data.length - 1)) * cw;
  const yf = v => P.top + ch - (v / maxVal) * ch;

  ctx.clearRect(0, 0, w, h);

  // Grid lines
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = (maxVal / 4) * i;
    const y = yf(v);
    ctx.strokeStyle = '#f0f0f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(P.left, y);
    ctx.lineTo(P.left + cw, y);
    ctx.stroke();
    ctx.fillStyle = '#bbb';
    ctx.fillText(shortNum(v), P.left - 6, y);
  }

  // X labels
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#bbb';
  for (let i = 0; i < data.length; i++) {
    if (i === 0 || i === data.length - 1 || i % 5 === 0) {
      ctx.fillText(data[i].year, xf(i), P.top + ch + 6);
    }
  }

  const baseY = P.top + ch;

  if (!data2) {
    // Single mode
    const ptsP = data.map((d, i) => ({ x: xf(i), y: yf(d.principal) }));
    const ptsN = data.map((d, i) => ({ x: xf(i), y: yf(d.nominal) }));

    // Fill principal area
    ctx.beginPath();
    ptsP.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.lineTo(ptsP[ptsP.length-1].x, baseY);
    ctx.lineTo(ptsP[0].x, baseY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(165,165,141,0.30)';
    ctx.fill();

    // Fill gain area
    ctx.beginPath();
    ptsN.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    for (let i = ptsP.length - 1; i >= 0; i--) ctx.lineTo(ptsP[i].x, ptsP[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(212,163,115,0.25)';
    ctx.fill();

    // Line: nominal
    ctx.beginPath();
    ptsN.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.strokeStyle = '#D4A373';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Line: principal
    ctx.beginPath();
    ptsP.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.strokeStyle = '#A5A58D';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Legend
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '10px sans-serif';
    ctx.fillStyle = 'rgba(165,165,141,0.30)';
    ctx.fillRect(w - 112, 6, 10, 10);
    ctx.fillStyle = '#A5A58D';
    ctx.fillText('累计本金', w - 98, 6);
    ctx.fillStyle = 'rgba(212,163,115,0.25)';
    ctx.fillRect(w - 42, 6, 10, 10);
    ctx.fillStyle = '#D4A373';
    ctx.fillText('复利收益', w - 28, 6);
  } else {
    // Comparison mode
    const ptsP = data.map((d, i) => ({ x: xf(i), y: yf(d.principal) }));
    const ptsN = data.map((d, i) => ({ x: xf(i), y: yf(d.nominal) }));
    const ptsN2 = data2.map((d, i) => ({ x: xf(i), y: yf(d.nominal) }));

    // Fill principal area
    ctx.beginPath();
    ptsP.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.lineTo(ptsP[ptsP.length-1].x, baseY);
    ctx.lineTo(ptsP[0].x, baseY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(165,165,141,0.30)';
    ctx.fill();

    // Fill gain area for A
    ctx.beginPath();
    ptsN.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    for (let i = ptsP.length - 1; i >= 0; i--) ctx.lineTo(ptsP[i].x, ptsP[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(212,163,115,0.25)';
    ctx.fill();

    // Line: A nominal
    ctx.beginPath();
    ptsN.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.strokeStyle = '#D4A373';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Line: B nominal (dashed)
    ctx.beginPath();
    ptsN2.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.strokeStyle = '#b85a5a';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Line: principal
    ctx.beginPath();
    ptsP.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.strokeStyle = '#A5A58D';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Legend
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '10px sans-serif';
    const r1 = document.getElementById('cp-rate-val').textContent;
    const r2 = document.getElementById('cp-rate2-val').textContent;
    let lx = w - 150, ly = 6;
    ctx.fillStyle = 'rgba(165,165,141,0.30)';
    ctx.fillRect(lx, ly, 10, 10);
    ctx.fillStyle = '#A5A58D';
    ctx.fillText('本金', lx + 14, ly);
    ctx.fillStyle = 'rgba(212,163,115,0.25)';
    ctx.fillRect(lx + 48, ly, 10, 10);
    ctx.fillStyle = '#D4A373';
    ctx.fillText('A ' + r1, lx + 62, ly);
    ctx.fillStyle = '#b85a5a';
    ctx.fillRect(lx + 100, ly, 10, 10);
    ctx.fillStyle = '#b85a5a';
    ctx.fillText('B ' + r2, lx + 114, ly);
  }
}
</script>

/* --- App initializer --- */
const App = {
  init() {
    // Init services
    Haptics.init();
    Actions.init();

    // Load habits from localStorage
    appHabits = Store.getHabits();
    renderTags();
    updateCalcBtn();

    // Sync range slider displays
    syncRangeDisplays();

    // Enter key on habit input
    document.getElementById('habitName').addEventListener('keydown', e => {
      if (e.key === 'Enter') Actions._registry.addHabit();
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/life-investment-calculator/sw.js?v=5');
    }

    // Restore compare toggle state
    // (checkbox state is preserved by browser, but cmpSection visibility needs sync)
    if (document.getElementById('cmpToggle').checked) {
      document.getElementById('cmpSection').classList.add('show');
    }
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
